# ==============================================================================
# HM-18.0 Pilot Configuration for 1-CTU 64x64 Debugging
# ==============================================================================

# ======== File I/O =====================
InputFile                     : workspace/inputs/sample_64x64_1frame.yuv
BitstreamFile                 : workspace/outputs/str.bin
ReconFile                     : workspace/outputs/rec.yuv

# ======== Profile & Level =============
Profile                       : main

# ======== Geometry & Format ===========
SourceWidth                   : 64          # 1 CTU Width
SourceHeight                  : 64          # 1 CTU Height
FramesToBeEncoded             : 1           # Exactly 1 Frame
FrameRate                     : 1
InputBitDepth                 : 8
InternalBitDepth              : 8
OutputBitDepth                : 8
InputChromaFormat             : 420
ChromaFormatIDC               : 420

# ======== Unit Definition =============
MaxCUWidth                    : 64          # Maximum coding unit width
MaxCUHeight                   : 64          # Maximum coding unit height
MaxPartitionDepth             : 4           # Maximum coding unit depth (64, 32, 16, 8)
QuadtreeTULog2MaxSize         : 5           # Max TU 32x32
QuadtreeTULog2MinSize         : 2           # Min TU 4x4
QuadtreeTUMaxDepthIntra       : 3

# ======== Coding Structure ============
IntraPeriod                   : 1           # All-Intra
DecodingRefreshType           : 1
GOPSize                       : 1

# ======== Quantization ================
QP                            : 32
MaxDeltaQP                    : 0
MaxCuDQPDepth                 : 0
DeltaQpRD                     : 0
RDOQ                          : 1
RDOQTS                        : 1

# ======== In-Loop Filters (Disabled for RDO Isolation) ========
LoopFilterDisable             : 1           # Disable Deblocking Filter
SAO                           : 0           # Disable Sample Adaptive Offset
SliceMode                     : 0           # Single Slice per frame
